name: Apply Approved Footer Sitewide

on:
  push:
    branches:
      - main
    paths:
      - anchor-update-trigger.html

permissions:
  contents: write

jobs:
  update-site-footers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved footer to all public HTML pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          css = '''.home-footer-test{background:var(--navy);color:#fff;padding:46px 25px 22px;border-top:6px solid var(--orange)}.home-footer-inner{max-width:1120px;margin:auto}.home-footer-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:100px;max-width:980px;margin:0 auto 34px}.home-footer-brand{max-width:500px}.home-footer-brand h2{color:#fff;margin:0}.home-footer-brand p{max-width:470px}.home-mkt-visibility{margin-top:24px}.home-mkt-visibility a,.home-footer-connect a,.home-footer-nav a,.home-footer-regions a,.home-mini-links a{color:#fff;text-decoration:none}.home-mkt-visibility>p{font-size:12px;line-height:1.55;margin:12px 0 8px}.home-tagline{font-size:9px;font-weight:bold;letter-spacing:1.6px;margin-top:3px}.home-mini-links{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:bold}.home-footer-connect{padding-top:4px}.home-footer-connect>strong{font-size:16px}.home-footer-connect p{max-width:330px;margin:16px 0}.home-footer-connect a{display:block;margin:9px 0}.home-footer-nav{border-top:1px solid rgba(255,255,255,.28);padding:24px 0 12px;display:flex;justify-content:center;gap:10px 22px;flex-wrap:wrap;text-align:center}.home-footer-nav a{font-size:13px;font-weight:bold}.home-footer-regions{display:flex;justify-content:center;align-items:center;gap:9px 18px;flex-wrap:wrap;padding:8px 0 18px;text-align:center;font-size:12px}.home-footer-regions strong{color:var(--gold)}.home-footer-regions a{font-size:12px}.home-footer-test .footer-bottom{border-top:1px solid rgba(255,255,255,.16);padding-top:18px;margin-top:4px;text-align:center;font-size:12px}.home-footer-test .mkt-partner-row{display:flex;gap:15px;align-items:center}.home-footer-test .brand-mark{width:68px;height:68px;border-radius:50%;object-fit:cover}.home-footer-test .mkt-partner-logo{width:65px;height:65px;object-fit:cover}@media(max-width:760px){.home-footer-top{grid-template-columns:1fr;gap:30px;max-width:560px}.home-footer-nav{gap:9px 16px}.home-footer-regions{align-items:flex-start}}'''

          footer = '''<footer class="home-footer-test"><div class="home-footer-inner"><div class="home-footer-top"><div class="home-footer-brand"><div class="mkt-partner-row"><img class="brand-mark" src="Facebook Profile Picture.png" alt="MKT Colorado"><div><h2>MKT Colorado</h2><small>DISCOVER • CONNECT • SUPPORT COLORADO</small></div></div><p>Celebrating the businesses, people, places and stories that make Colorado worth exploring.</p><div class="home-mkt-visibility"><div class="mkt-partner-row"><img class="mkt-partner-logo" src="MKT Visibility Logo main profile pic.png" alt="MKT Visibility"><div><a href="https://mktvisibility.com" target="_blank" rel="noopener noreferrer"><strong>MKT Visibility</strong></a><div class="home-tagline">WE KEEP YOUR BUSINESS VISIBLE.</div></div></div><p>Helping small businesses stay visible through social media, digital marketing, websites, photography, video and Google Business Profile support.</p><div class="home-mini-links"><a href="https://mktvisibility.com" target="_blank" rel="noopener noreferrer">Website →</a><a href="https://www.facebook.com/profile.php?id=61594428531114" target="_blank" rel="noopener noreferrer">Facebook →</a></div></div></div><div class="home-footer-connect"><strong>Connect With MKT Colorado</strong><p>Know a Colorado business, place or story we should feature?</p><a href="mailto:MKTvisibility@gmail.com">MKTvisibility@gmail.com</a><a href="https://www.facebook.com/share/14o86J3YFEB/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">Follow MKT Colorado on Facebook</a><a href="contact.html">Contact MKT Colorado</a></div></div><div class="home-footer-nav"><a href="index.html">Home</a><a href="about.html">About</a><a href="businesses.html">Businesses</a><a href="regions.html">Regions</a><a href="towns.html">Colorado A–Z</a><a href="spotlight.html">In The Spotlight</a><a href="events.html">Events</a><a href="experiences.html">Experiences</a><a href="food-drink.html">Food & Drink</a><a href="makers.html">Makers</a><a href="search.html">🔍 Search</a><a href="site-map.html">Site Map</a><a href="contact.html">Contact</a></div><div class="home-footer-regions"><strong>Explore Colorado Regions:</strong><a href="eastern-plains.html">Eastern Plains</a><a href="front-range.html">Front Range</a><a href="mountain-towns.html">Mountain Towns</a><a href="southern-colorado.html">Southern Colorado</a><a href="western-slope.html">Western Slope</a></div><div class="footer-bottom">© 2026 MKT Colorado • A statewide project presented by MKT Visibility.</div></div></footer>'''

          for p in Path('.').glob('*.html'):
              if p.name == 'anchor-update-trigger.html':
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              if '.home-footer-test{' not in text:
                  text = text.replace('</style>', css + '</style>', 1)
              if re.search(r'<footer\b.*?</footer>', text, flags=re.I | re.S):
                  text = re.sub(r'<footer\b.*?</footer>', footer, text, count=1, flags=re.I | re.S)
              if text != original:
                  p.write_text(text, encoding='utf-8')
          PY
      - name: Commit sitewide footer update
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            exit 0
          fi
          git config user.name "MKT Colorado Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          git commit -m "Apply approved compact footer sitewide"
          git push