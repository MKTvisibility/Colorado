name: Maintain MKT Colorado listing anchors, links and navigation
on:
  push:
    branches: [main]
    paths:
      - '**.html'
permissions:
  contents: write
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Maintain listing anchors, external links and Site Map navigation
        run: |
          python - <<'PY'
          import re, pathlib, unicodedata
          from urllib.parse import urlparse

          def slug(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
              s=re.sub(r'<[^>]+>',' ',s)
              return re.sub(r'[^a-z0-9]+','-',s).strip('-')

          def external_links_new_tab(text):
              pat=re.compile(r'<a\b([^>]*?\bhref=["\'](https?://[^"\']+)["\'][^>]*)>',re.I)
              def repl(m):
                  attrs,url=m.group(1),m.group(2)
                  host=(urlparse(url).hostname or '').lower()
                  if host=='mktvisibility.github.io' and urlparse(url).path.startswith('/Colorado'):
                      return m.group(0)
                  if re.search(r'\btarget\s*=\s*["\'][^"\']*["\']',attrs,re.I):
                      attrs=re.sub(r'\btarget\s*=\s*["\'][^"\']*["\']','target="_blank"',attrs,flags=re.I)
                  else:
                      attrs+=' target="_blank"'
                  if 'rel=' not in attrs.lower(): attrs+=' rel="noopener noreferrer"'
                  return '<a'+attrs+'>'
              return pat.sub(repl,text)

          def add_sitemap_to_section(section):
              if re.search(r'href=["\']site-map\.html["\']', section, re.I):
                  return section
              sitemap='<a href="site-map.html">Site Map</a>'
              search=re.search(r'<a\b[^>]*href=["\']search\.html[^"\']*["\'][^>]*>',section,re.I)
              if search:
                  return section[:search.start()]+sitemap+section[search.start():]
              contact=re.search(r'<a\b[^>]*href=["\']contact\.html["\'][^>]*>',section,re.I)
              if contact:
                  return section[:contact.start()]+sitemap+section[contact.start():]
              return section

          def add_sitemap_links(text):
              def header_repl(m): return add_sitemap_to_section(m.group(0))
              def footer_repl(m): return add_sitemap_to_section(m.group(0))
              text=re.sub(r'<header\b.*?</header>',header_repl,text,flags=re.I|re.S)
              text=re.sub(r'<footer\b.*?</footer>',footer_repl,text,flags=re.I|re.S)
              return text

          for p in pathlib.Path('.').glob('*.html'):
              if p.name=='anchor-update-trigger.html': continue
              text=p.read_text(encoding='utf-8')
              new=text
              used=set(re.findall(r'\bid="([^"]+)"',new))
              pat=re.compile(r'<article class="card"(?![^>]*\bid=)([^>]*)>(.*?)(</article>)',re.S)
              def addid(m):
                  h=re.search(r'<h3[^>]*>(.*?)</h3>',m.group(2),re.S)
                  if not h:return m.group(0)
                  base=slug(h.group(1)) or 'listing'; ident=base; n=2
                  while ident in used: ident=f'{base}-{n}'; n+=1
                  used.add(ident)
                  return f'<article class="card" id="{ident}"{m.group(1)}>{m.group(2)}{m.group(3)}'
              new=pat.sub(addid,new)
              new=external_links_new_tab(new)
              new=add_sitemap_links(new)
              if new!=text:p.write_text(new,encoding='utf-8')
          PY
      - name: Commit maintained HTML
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'MKT Colorado Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Maintain listing anchors, links and Site Map navigation'
          git push