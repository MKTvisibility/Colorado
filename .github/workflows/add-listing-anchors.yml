name: Maintain MKT Colorado listing anchors, links and navigation
on:
  push:
    branches: [main]
    paths:
      - '**.html'
permissions:
  contents: write
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Maintain listing anchors, external links and navigation
        run: |
          python - <<'PY'
          import re, pathlib, unicodedata
          from urllib.parse import urlparse

          def slug(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
              s=re.sub(r'<[^>]+>',' ',s)
              return re.sub(r'[^a-z0-9]+','-',s).strip('-')

          def external_links_new_tab(text):
              pat=re.compile(r'<a\b([^>]*?\bhref=["\'](https?://[^"\']+)["\'][^>]*)>',re.I)
              def repl(m):
                  attrs,url=m.group(1),m.group(2)
                  host=(urlparse(url).hostname or '').lower()
                  if host=='mktvisibility.github.io' and urlparse(url).path.startswith('/Colorado'):
                      return m.group(0)
                  if re.search(r'\btarget\s*=\s*["\'][^"\']*["\']',attrs,re.I):
                      attrs=re.sub(r'\btarget\s*=\s*["\'][^"\']*["\']','target="_blank"',attrs,flags=re.I)
                  else:
                      attrs+=' target="_blank"'
                  if 'rel=' not in attrs.lower(): attrs+=' rel="noopener noreferrer"'
                  return '<a'+attrs+'>'
              return pat.sub(repl,text)

          main_links = [
              ('index.html','Home'),('about.html','About'),('businesses.html','Businesses'),
              ('regions.html','Regions'),('towns.html','Colorado A–Z'),('spotlight.html','In The Spotlight'),
              ('events.html','Events'),('experiences.html','Experiences'),('food-drink.html','Food & Drink'),
              ('makers.html','Makers'),('search.html','🔍 Search'),('site-map.html','Site Map')
          ]
          region_links = [
              ('eastern-plains.html','Eastern Plains'),('front-range.html','Front Range'),
              ('mountain-towns.html','Mountain Towns'),('southern-colorado.html','Southern Colorado'),
              ('western-slope.html','Western Slope')
          ]
          facebook='https://www.facebook.com/share/14o86J3YFEB/?mibextid=wwXIfr'

          def links_html(items):
              return ''.join(f'<a href="{href}">{label}</a>' for href,label in items)

          def standardize_header(section):
              nav_match=re.search(r'(<div\b[^>]*class=["\'][^"\']*nav-links[^"\']*["\'][^>]*>)(.*?)(</div>)',section,re.I|re.S)
              if not nav_match: return section
              body=links_html(main_links)
              body+=f'<a href="{facebook}" target="_blank" rel="noopener noreferrer">Facebook</a>'
              body+='<a href="contact.html" class="nav-contact">Contact</a>'
              return section[:nav_match.start()]+nav_match.group(1)+body+nav_match.group(3)+section[nav_match.end():]

          def standardize_footer(section):
              # Replace the first footer navigation/link collection with all requested main + regional pages.
              block=re.search(r'(<div\b[^>]*class=["\'][^"\']*footer-links[^"\']*["\'][^>]*>)(.*?)(</div>)',section,re.I|re.S)
              if not block: return section
              body=links_html(main_links + [('contact.html','Contact')] + region_links)
              body+=f'<a href="{facebook}" target="_blank" rel="noopener noreferrer">Facebook</a>'
              return section[:block.start()]+block.group(1)+body+block.group(3)+section[block.end():]

          for p in pathlib.Path('.').glob('*.html'):
              if p.name=='anchor-update-trigger.html': continue
              text=p.read_text(encoding='utf-8')
              new=text
              used=set(re.findall(r'\bid="([^"]+)"',new))
              pat=re.compile(r'<article class="card"(?![^>]*\bid=)([^>]*)>(.*?)(</article>)',re.S)
              def addid(m):
                  h=re.search(r'<h3[^>]*>(.*?)</h3>',m.group(2),re.S)
                  if not h:return m.group(0)
                  base=slug(h.group(1)) or 'listing'; ident=base; n=2
                  while ident in used: ident=f'{base}-{n}'; n+=1
                  used.add(ident)
                  return f'<article class="card" id="{ident}"{m.group(1)}>{m.group(2)}{m.group(3)}'
              new=pat.sub(addid,new)
              new=external_links_new_tab(new)
              new=re.sub(r'<header\b.*?</header>',lambda m:standardize_header(m.group(0)),new,flags=re.I|re.S)
              new=re.sub(r'<footer\b.*?</footer>',lambda m:standardize_footer(m.group(0)),new,flags=re.I|re.S)
              if new!=text:p.write_text(new,encoding='utf-8')
          PY
      - name: Commit maintained HTML
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'MKT Colorado Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Standardize sitewide header and footer navigation'
          git push