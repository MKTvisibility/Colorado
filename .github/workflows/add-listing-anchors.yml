name: Add listing anchors
on:
  push:
    branches: [main]
    paths:
      - '**.html'
permissions:
  contents: write
jobs:
  anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add unique IDs to listing cards
        run: |
          python - <<'PY'
          import re, pathlib, unicodedata
          def slug(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
              s=re.sub(r'<[^>]+>',' ',s)
              s=re.sub(r'[^a-z0-9]+','-',s).strip('-')
              return s
          for p in pathlib.Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              used=set(re.findall(r'\bid="([^"]+)"',text))
              pattern=re.compile(r'<article class="card"(?![^>]*\bid=)([^>]*)>(.*?)(</article>)',re.S)
              def repl(m):
                  body=m.group(2)
                  h=re.search(r'<h3[^>]*>(.*?)</h3>',body,re.S)
                  if not h: return m.group(0)
                  base=slug(h.group(1)) or 'listing'
                  ident=base; n=2
                  while ident in used:
                      ident=f'{base}-{n}'; n+=1
                  used.add(ident)
                  return f'<article class="card" id="{ident}"{m.group(1)}>{body}{m.group(3)}'
              new=pattern.sub(repl,text)
              if new!=text:
                  p.write_text(new,encoding='utf-8')
          PY
      - name: Commit anchors
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'MKT Colorado Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Add unique anchors to listing cards'
          git push